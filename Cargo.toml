[package]
name = "nymplayer"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
flacenc = { version = "0.5.1", default-features = false }
hound = "3.5.1"
ringbuf = "0.5.3"
rubato = "5.0.1"
rfd = "0.17.2"
# TLS for the Cast control channel; ring only (rustls's default would add aws-lc too).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tray-icon = "0.26.1"

[dev-dependencies]
# The decoder, to check recorded FLAC files in tests.
flacenc = { version = "0.5.1", default-features = false, features = ["decode"] }

[target.'cfg(windows)'.dependencies]
# Process loopback ("All PC sound"), which cpal doesn't offer.
wasapi = "0.26.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[build-dependencies]
winresource = "0.1.34"

# Published builds (release workflow): link-time optimization makes the exe about 20%
# smaller but the build ~2 min slower, so everyday `--release` builds skip it.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# Dependencies optimized for size (8.9 instead of 10.2 MB); the resampler runs in the audio
# callback, so it keeps full speed, as does NymPlayer's own code (the profile's opt-level).
[profile.dist.package."*"]
opt-level = "s"

[profile.dist.package.rubato]
opt-level = 3
