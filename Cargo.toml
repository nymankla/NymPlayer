[package]
name = "nymplayer"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
ringbuf = "0.5.3"
oxicast = "0.0.3"
rubato = "5.0.1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"
